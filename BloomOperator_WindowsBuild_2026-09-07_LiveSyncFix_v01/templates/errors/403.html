{% extends "base.html" %}

{% block title %}Access Forbidden (403) - Bloom{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div class="card" style="max-width: 500px; text-align: center; padding: 2.5rem;">
        <span style="font-size: 3.5rem; color: var(--danger); display: block; margin-bottom: 1rem;">🚫</span>
        <h2 style="font-weight: 800; margin-bottom: 0.5rem;">403 Forbidden</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
            {{ detail or "You do not have permission to access this resource." }}
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="/" class="btn btn-primary" style="color: white;">Return Home</a>
            <a href="/logout" class="btn btn-secondary">Log In with Different User</a>
        </div>
    </div>
</div>
{% endblock %}
