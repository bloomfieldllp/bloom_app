<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bloom ID Card</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">

<main class="login-container">
    <!-- Illustration Section -->
    <div class="login-illustration-wrap">
        <img src="/static/images/login-illustration.svg" alt="Login Illustration" class="login-illustration">
    </div>

    <!-- Title -->
    <h1 class="login-title">Welcome, Teacher!</h1>

    <!-- Login Form (Standard HTML Form Submit) -->
    <form id="loginForm" class="login-form" action="/login" method="POST">
        <!-- Error Message Container (Jinja2 Rendered) -->
        {% if error %}
        <div class="error-message" style="display: block;">{{ error }}</div>
        {% endif %}

        <!-- Phone/Email Input Group -->
        <div class="input-group">
            <span class="input-icon">
                <!-- Outline Phone/User SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
            </span>
            <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Phone number or Email" 
                required 
                autocomplete="username"
            >
        </div>

        <!-- Password Input Group -->
        <div class="input-group">
            <span class="input-icon">
                <!-- Outline Lock SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </span>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Password" 
                required 
                autocomplete="current-password"
            >
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
                <!-- Outline Eye (Visible) -->
                <svg id="eyeIconVisible" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <!-- Outline Eye (Hidden) -->
                <svg id="eyeIconHidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-password-wrap">
            <a href="#" class="forgot-password-link">Forgot password?</a>
        </div>

        <!-- Submit Button Group -->
        <div class="submit-wrap">
            <button type="submit" class="login-circle-btn" aria-label="Submit Login">
                <!-- Outline Arrow Right SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
            <span class="submit-label">Login</span>
        </div>
    </form>

    <!-- Footer Section -->
    <footer class="login-footer">
        <p>New here? Contact your school admin to get started.</p>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="footer-leaf-icon">
            <path d="M2 22C2 22 8 20 12 16C16 12 22 2 22 2C2 2 12 16 12 16"></path>
            <path d="M12 16C12 16 14 10 18 6"></path>
        </svg>
    </footer>
</main>

<script>
    // Toggle Password Visibility
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIconVisible = document.getElementById('eyeIconVisible');
    const eyeIconHidden = document.getElementById('eyeIconHidden');

    togglePasswordBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIconVisible.style.display = 'none';
            eyeIconHidden.style.display = 'block';
        } else {
            passwordInput.type = 'password';
            eyeIconVisible.style.display = 'block';
            eyeIconHidden.style.display = 'none';
        }
    });
</script>

</body>
</html>
