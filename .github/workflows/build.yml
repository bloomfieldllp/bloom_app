name: Build Desktop Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --name="BloomOperator" --onedir --add-data="templates;templates" --add-data="static;static" main.py

      - name: Compile Windows Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_config.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloomOperator-Windows-Installer
          path: dist/BloomOperatorSetup.exe
