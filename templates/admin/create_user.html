{% extends "base.html" %}

{% block title %}Create User - BLOOM ID CARD{% endblock %}

{% block content %}
<div class="login-container" style="min-height: auto; margin-top: 2rem; margin-bottom: 2rem;">
    <div class="card" style="width: 100%; max-width: 600px; padding: 2rem;">
        <h2 style="font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.25rem;">Create User</h2>
        <p class="subtitle" style="margin-bottom: 1.5rem;">Register a new school admin or operator.</p>
        
        <form action="/admin/users" method="POST">
            
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="9876543210" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address (Optional)</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="user@gmail.com">
            </div>

            <div class="form-group">
                <label for="user_type">User Type *</label>
                <select id="user_type" name="user_type" class="form-control" required onchange="toggleSchoolField(this.value)">
                    <option value="school_user">School Admin / Staff</option>
                    <option value="operator">Photography Operator</option>
                </select>
            </div>

            <div class="form-group" id="linkedSchoolGroup">
                <label for="user_school">Linked School *</label>
                <select id="user_school" name="school_id" class="form-control">
                    <option value="">-- Select School --</option>
                    {% for school in schools %}
                        <option value="{{ school._id }}">{{ school.name }} ({{ school.school_code }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group password-wrapper">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                <button type="button" class="eye-btn" onclick="togglePasswordVisibility('password')" aria-label="Toggle Password Visibility">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                </button>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Create User</button>
                <a href="/admin" class="btn btn-secondary" style="flex: 1; text-align: center; text-decoration: none;">Cancel</a>
            </div>
            
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function toggleSchoolField(userType) {
        const group = document.getElementById("linkedSchoolGroup");
        const select = document.getElementById("user_school");
        if (userType === "operator") {
            group.style.display = "none";
            select.removeAttribute("required");
        } else {
            group.style.display = "block";
            select.setAttribute("required", "required");
        }
    }
    // Run initially
    document.addEventListener("DOMContentLoaded", () => {
        toggleSchoolField(document.getElementById("user_type").value);
    });
</script>
{% endblock %}
