{% extends "base.html" %}
{% block title %}Bad Request{% endblock %}
{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center; font-family: 'Inter', sans-serif;">
    <h1 style="font-size: 6rem; margin: 0; color: #f59e0b;">400</h1>
    <h2 style="font-size: 2rem; margin: 0 0 1rem 0; color: #1a1a19;">Bad Request</h2>
    <p style="color: #5C5A56; max-width: 500px; margin-bottom: 2rem;">{{ detail | default("The request was invalid or could not be understood.") }}</p>
    <button onclick="window.history.back()" style="padding: 12px 24px; background-color: #1a1a19; color: white; border-radius: 8px; text-decoration: none; font-weight: 500; cursor: pointer; border: none;">Go Back</button>
</div>
{% endblock %}
