{% extends "base.html" %}

{% block title %}Page Not Found (404) - Bloom{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div class="card" style="max-width: 500px; text-align: center; padding: 2.5rem;">
        <span style="font-size: 3.5rem; color: var(--brand-primary); display: block; margin-bottom: 1rem;">🔍</span>
        <h2 style="font-weight: 800; margin-bottom: 0.5rem;">404 Page Not Found</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
            {{ detail or "The page or resource you are looking for does not exist." }}
        </p>
        <a href="/" class="btn btn-primary" style="color: white; display: inline-block;">Return Home</a>
    </div>
</div>
{% endblock %}
