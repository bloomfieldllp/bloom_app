<!-- Add/Edit Student Modal -->
<div id="student-modal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center;">
    <div class="modal-content admin-card" style="background-color: #FDFCF8; padding: 2rem; border-radius: 16px; width: 90%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative;">
        <span class="close-modal" onclick="closeStudentModal()" style="position: absolute; top: 1rem; right: 1.5rem; font-size: 1.5rem; cursor: pointer; color: #555;">&times;</span>
        <h2 id="modal-title" style="margin-top: 0; margin-bottom: 1.5rem; color: #111; font-weight: 800;">Add Student</h2>
        
        <form id="student-form" method="POST">
            <!-- Hidden field for student ID on edit -->
            <input type="hidden" id="student_id" name="student_id">
            
            <div id="modal-error-container" style="display: none; margin-bottom: 1rem; padding: 0.75rem; background-color: #f8d7da; color: #721c24; border-radius: 8px; font-size: 0.9rem;"></div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- GR Field -->
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <label for="gr" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #5C5A56;">GR Number <span style="color: red;">*</span></label>
                    <input type="text" id="gr" name="gr" required style="padding: 10px 14px; border-radius: 8px; border: 1px solid #EBEAE4; font-size: 1rem;">
                    <small id="gr-help" style="color: #666; font-size: 0.75rem; display: none;">GR Number cannot be changed after creation.</small>
                </div>
                
                <!-- Name Field -->
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <label for="name" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #5C5A56;">Student Name <span style="color: red;">*</span></label>
                    <input type="text" id="name" name="name" required style="padding: 10px 14px; border-radius: 8px; border: 1px solid #EBEAE4; font-size: 1rem;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <!-- Date of Birth Field -->
                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                        <label for="date_of_birth" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #5C5A56;">Date of Birth</label>
                        <input type="date" id="date_of_birth" name="date_of_birth" style="padding: 10px 14px; border-radius: 8px; border: 1px solid #EBEAE4; font-size: 1rem;">
                    </div>
                    
                    <!-- Address Field -->
                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                        <label for="address" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #5C5A56;">Address</label>
                        <input type="text" id="address" name="address" style="padding: 10px 14px; border-radius: 8px; border: 1px solid #EBEAE4; font-size: 1rem;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <!-- Standard Field -->
                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                        <label for="standard" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #5C5A56;">Standard</label>
                        <input type="text" id="standard" name="standard" style="padding: 10px 14px; border-radius: 8px; border: 1px solid #EBEAE4; font-size: 1rem;">
                    </div>
                    
                    <!-- Division Field -->
                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                        <label for="division" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #5C5A56;">Division</label>
                        <input type="text" id="division" name="division" style="padding: 10px 14px; border-radius: 8px; border: 1px solid #EBEAE4; font-size: 1rem;">
                    </div>
                </div>

                <!-- Roll Number Field -->
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <label for="roll_number" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #5C5A56;">Roll Number</label>
                    <input type="text" id="roll_number" name="roll_number" style="padding: 10px 14px; border-radius: 8px; border: 1px solid #EBEAE4; font-size: 1rem;">
                </div>
                
                <!-- Dynamic Fields Container -->
                <div id="dynamic-fields-container" style="display: flex; flex-direction: column; gap: 1rem;"></div>
            </div>
            
            <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
                <button type="button" onclick="closeStudentModal()" class="btn-secondary" style="padding: 0.75rem 1.5rem; border: none; background: transparent; cursor: pointer; font-weight: 600;">Cancel</button>
                <button type="submit" class="btn-primary-dark" style="padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Save Student</button>
            </div>
        </form>
    </div>
</div>

<script>
async function loadDynamicFields(apiBase, schoolId, studentData = null) {
    const container = document.getElementById('dynamic-fields-container');
    container.innerHTML = '';
    if (!schoolId) return;
    
    try {
        const response = await fetch(`${apiBase}/schools/${schoolId}/fields`);
        const fields = await response.json();
        
        fields.forEach(f => {
            if (!f.active) return;
            const val = studentData && studentData.custom_fields && studentData.custom_fields[f.key] ? studentData.custom_fields[f.key] : '';
            
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.flexDirection = 'column';
            div.style.gap = '0.4rem';
            
            const label = document.createElement('label');
            label.htmlFor = `custom_${f.key}`;
            label.style.fontSize = '0.8rem';
            label.style.fontWeight = '700';
            label.style.textTransform = 'uppercase';
            label.style.color = '#5C5A56';
            label.innerText = f.label + (f.required ? ' *' : '');
            
            const input = document.createElement('input');
            input.type = f.type === 'date' ? 'date' : (f.type === 'number' ? 'number' : 'text');
            input.id = `custom_${f.key}`;
            input.name = `custom_${f.key}`;
            input.value = val;
            if (f.required) input.required = true;
            input.style.padding = '10px 14px';
            input.style.borderRadius = '8px';
            input.style.border = '1px solid #EBEAE4';
            input.style.fontSize = '1rem';
            
            div.appendChild(label);
            div.appendChild(input);
            container.appendChild(div);
        });
    } catch (e) {
        console.error("Failed to load dynamic fields:", e);
    }
}

function openAddStudentModal(actionUrl, apiBase, schoolId) {
    document.getElementById('modal-title').innerText = 'Add Student';
    document.getElementById('student-form').action = actionUrl;
    document.getElementById('student_id').value = '';
    
    // Reset fields
    document.getElementById('gr').value = '';
    document.getElementById('gr').readOnly = false;
    document.getElementById('gr').style.backgroundColor = '#FFFFFF';
    document.getElementById('gr-help').style.display = 'none';
    
    document.getElementById('name').value = '';
    document.getElementById('date_of_birth').value = '';
    document.getElementById('address').value = '';
    document.getElementById('standard').value = '';
    document.getElementById('division').value = '';
    document.getElementById('roll_number').value = '';
    
    document.getElementById('modal-error-container').style.display = 'none';
    
    loadDynamicFields(apiBase, schoolId, null);
    
    const modal = document.getElementById('student-modal');
    modal.style.display = 'flex';
}

function openEditStudentModal(actionUrl, student, apiBase, schoolId) {
    document.getElementById('modal-title').innerText = 'Edit Student';
    document.getElementById('student-form').action = actionUrl;
    document.getElementById('student_id').value = student.id || student._id;
    
    // Populate fields
    document.getElementById('gr').value = student.gr || '';
    document.getElementById('gr').readOnly = true;
    document.getElementById('gr').style.backgroundColor = '#f0f0f0';
    document.getElementById('gr-help').style.display = 'block';
    
    document.getElementById('name').value = student.name || '';
    document.getElementById('date_of_birth').value = student.date_of_birth || '';
    document.getElementById('address').value = student.address || '';
    document.getElementById('standard').value = student.standard || student.class_name || '';
    document.getElementById('division').value = student.division || student.section || '';
    document.getElementById('roll_number').value = student.roll_number || '';
    
    document.getElementById('modal-error-container').style.display = 'none';
    
    loadDynamicFields(apiBase, schoolId, student);
    
    const modal = document.getElementById('student-modal');
    modal.style.display = 'flex';
}

function closeStudentModal() {
    document.getElementById('student-modal').style.display = 'none';
}

// Close modal if clicked outside
window.onclick = function(event) {
    const modal = document.getElementById('student-modal');
    if (event.target == modal) {
        closeStudentModal();
    }
}
</script>
